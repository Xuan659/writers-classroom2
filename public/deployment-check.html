<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>確認網站是否更新完成</title><link rel="stylesheet" href="./styles.css?v=20261118-speed-07"></head><body><main style="max-width:820px"><span class="eyebrow">小作家・更新確認</span><h1>確認網站已更新</h1><p>本頁版本：20261118-speed-07</p><div class="connection-status" id="result" role="status">正在確認正式網站的服務版本…</div><p><a class="primary" href="./">返回寫作教室</a></p></main><script>const box=document.getElementById("result");if(location.protocol==="file:"){box.textContent="你目前開啟的是本機檔案。請先更新 GitHub 並等 Cloudflare 部署成功，再用正式網址開啟這個檢查頁。"}else{fetch("./api/workflow-health",{cache:"no-store",signal:AbortSignal.timeout(20000)}).then(async r=>{const d=await r.json();box.textContent=r.ok&&d.workflow==="two-stage-v1"&&d.release==="20261118-speed-07"?"確認完成：前後台已是本次版本，可以開始試填第一階段。":d.release?"服務版本："+d.release+"。請確認這次部署是否完成。":"後端尚未更新：請把 public、worker 與根目錄的 wrangler.jsonc 一起更新，再等 Cloudflare 部署成功。"}).catch(()=>box.textContent="目前未能確認服務版本。請確認本次 Cloudflare 部署成功，並檢查網路後重新整理。")}</script></body></html>
